name: Build iOS .ipa

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [lua, luajit]

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: brew install ninja pkg-config cmake

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: work/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.flavor }}-${{ hashFiles('vcpkg-overlay/sdl2/vcpkg.json', 'vcpkg-overlay/sdl2/scene-lifecycle.patch') }}

      - name: Build (${{ matrix.flavor }})
        run: FLAVOR=${{ matrix.flavor }} ./scripts/build-ios.sh

      - name: Upload ${{ matrix.flavor }} .ipa
        uses: actions/upload-artifact@v4
        with:
          name: luanti-ios-${{ matrix.flavor }}
          path: luanti-ios-${{ matrix.flavor }}.ipa
          if-no-files-found: error
